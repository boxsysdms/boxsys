docs: |-
  Allows a role to be updated.

  This endpoint performs a PATCH operation, so all parameters are optional. The role’s scope cannot be changed. The `displayName` and `description` fields can be provided either as strings or as objects, where each key is a language code and each value is the corresponding translation. When provided as strings, the values are associated with the requested language, or with the system’s default language if no supported language is specified.

  Returns the role data, including its `uuid`, `scope`, `name`, and `description`. The `displayName` and `description` fields are returned as strings in the selected language, or in the system’s default language when no supported language is specified.
