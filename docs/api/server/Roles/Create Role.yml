docs: |
  Creates a new role within a specific scope.

  The `scope` and `displayName` fields are required. Both `displayName` and `description` can be provided either as strings or as objects, where each key is a language code and each value is the corresponding translation. When provided as strings, the values are associated with the requested language, or with the system’s default language if no supported language is specified.

  The language is optional and can be specified using the `lang` parameter or the `Accept-Language` header. If no language is specified, or if the requested language is not supported, the system’s configured default language is used.

  Returns the newly created role, including its `uuid`, `scope`, `name`, and `description`. The `displayName` and `description` fields are returned as strings in the selected language, or in the system’s default language when no supported language is specified.
