info:
  name: Create Role
  type: http
  seq: 2

http:
  method: POST
  url: "{{SERVER_URL}}/roles"
  body:
    type: json
    data: |-
      {
        "scope": "system",
        "displayName": "My Role",
        "description": "A simple role for testing purpose."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

