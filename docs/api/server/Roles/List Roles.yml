docs: |
  Lists the roles for a specific scope. The scope is required.

  For each role, the response includes its identifier, name, description, total number of associated users and permissions, and timestamps. The `displayName` and `description` fields are translatable.

  The client can specify the preferred language using the `lang` parameter or the `Accept-Language` header. If the requested language is not supported, the response is returned in the system’s configured default language.

  Results are paginated. The client can specify the number of items per page using the `perPage` parameter, with a minimum of 15 and a maximum of 50. The requested page is specified using the `page` parameter.

  Results can be sorted by `displayName`, `description`, `createdAt` or `updatedAt`. Sorting by `displayName` and `description` is performed using the selected language, or the system’s default language if no language is specified or the requested language is not supported.
