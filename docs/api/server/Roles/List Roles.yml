info:
  name: List Roles
  type: http
  seq: 1

http:
  method: GET
  url: "{{SERVER_URL}}/roles?scope=system&search="
  params:
    - name: scope
      value: system
      type: query
      description: Role scope. Required.
    - name: search
      value: ""
      type: query
      description: Search term. The search is performed against the role name and description in the selected language.
    - name: sortBy
      value: ""
      type: query
      description: Sort column. Defaults to displayName.
      disabled: true
    - name: sortOrder
      value: ""
      type: query
      description: Sort order. Defaults to ascending order.
      disabled: true
    - name: page
      value: ""
      type: query
      description: Page number. Defaults to 1.
      disabled: true
    - name: perPage
      value: ""
      type: query
      description: Number of items per page. Minimum of 15 and maximum of 50. Defaults to 15.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

