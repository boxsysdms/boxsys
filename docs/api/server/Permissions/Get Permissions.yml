docs: |-
  Lists the permissions supported by the system for a specific scope. The scope is required. For each permission, the response includes its technical name and description. Only the description is translatable.

  The client can specify the preferred language using the `lang` parameter or the `Accept-Language` header. If the requested language is not supported, the response is returned in the system’s configured default language.

  Results are paginated. The client can specify the number of items per page using the `perPage` parameter, with a minimum of 15 and a maximum of 100. The requested page is specified using the `page` parameter. Results cannot be sorted.
