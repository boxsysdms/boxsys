info:
  name: Get Permissions
  type: http
  seq: 1

http:
  method: GET
  url: "{{SERVER_URL}}/permissions?scope=xxx"
  params:
    - name: scope
      value: xxx
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

