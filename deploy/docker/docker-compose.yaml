name: boxsys

services:
  server-db:
    extends:
      file: docker-compose.infrastructure.yaml
      service: postgres-template
    ports:
      - "${SERVER_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${SERVER_DB_NAME}
      POSTGRES_USER: ${SERVER_DB_USER}
      POSTGRES_PASSWORD: ${SERVER_DB_PASSWORD:?Set SERVER_DB_PASSWORD}
    volumes:
      - server-db-data:/var/lib/postgresql

  server-cache:
    extends:
      file: docker-compose.infrastructure.yaml
      service: redis-template
    command: ["redis-server", "--requirepass", "${SERVER_CACHE_PASSWORD:?Set SERVER_CACHE_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${SERVER_CACHE_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${SERVER_CACHE_PASSWORD}
    volumes:
      - server-cache-data:/data

volumes:
  server-cache-data:
  server-db-data:
  server-app-storage:
  server-app-vendor:
  server-app-bootstrap-cache:

networks:
  boxsys-network:
    driver: bridge
