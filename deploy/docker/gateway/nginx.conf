# Docker DNS is resolved again after a backend container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;

# Reject hosts that do not belong to this stack.
server {
    listen 80 default_server;
    server_name _;

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name boxsys.local;

    location / {
        set $portal portal:3000;
        proxy_pass http://$portal;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        # Preserve Next.js streaming responses and development updates.
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name api.boxsys.local;

    location / {
        set $api server:80;
        proxy_pass http://$api;
        proxy_buffering off;
    }
}
