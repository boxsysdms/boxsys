name: BoxSys Portal CD Workflow

on:
  push:
    branches: ["preview"]
    tags: ["*"]
    paths:
      - "apps/portal/**"
      - "deploy/docker/**"
      - ".github/workflows/cd-portal.yaml"

permissions:
  contents: read
  packages: write

concurrency:
  group: portal-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and Publish Portal Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Image Metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/boxsys-portal
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/preview' }}

      - name: Build and Push Portal Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile
          target: production
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
