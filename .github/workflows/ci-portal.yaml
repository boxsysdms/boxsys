name: BoxSys Portal CI Workflow

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ci-portal.yaml"
      - ".tool-versions"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/portal/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/ci-portal.yaml"
      - ".tool-versions"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/portal/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"

jobs:
  test-and-lint:
    name: Run Portal Unit Tests and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint Validation
        run: pnpm --filter @boxsys/portal lint

      - name: Run Unit Tests
        run: pnpm --filter @boxsys/portal test
