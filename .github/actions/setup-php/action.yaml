name: Setup PHP
description: Setup PHP for GitHub Actions

inputs:
  workdir:
    description: "The working directory to run the action in."
    required: false
    default: "."
  version:
    description: "The PHP version to setup."
    required: false
    default: "8.5.4"
  extensions:
    description: "A comma-separated list of additional PHP extensions to install."
    required: false
    default: ""
  coverage:
    description: "Whether to enable code coverage support."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.version }}
        extensions: mbstring, json, sqlite, bcmath, pcntl, ${{ inputs.extensions }}
        coverage: ${{ inputs.coverage }}
        tools: composer
    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ inputs.workdir }}/vendor
        key: composer-${{ inputs.version }}-${{ hashFiles(format('{0}/composer.lock', inputs.workdir)) }}
        restore-keys: composer-${{ inputs.version }}-
    - name: Install Composer dependencies
      shell: bash
      run: composer install --prefer-dist --no-progress --no-interaction
      working-directory: ${{ inputs.workdir }}
